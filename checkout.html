<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AL-SHAHBAZ CHADAR HOUSE</title>

<link rel="stylesheet" href="assets/css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

body{
  font-family:Poppins;
  margin:0;
  background:#f7f7f7;
}

/* HEADER */
header{
  text-align:center;
  padding:15px;
  background:white;
  border-bottom:1px solid #eee;
}

/* HERO */
.hero{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  align-items:center;
  padding:60px 20px;
  gap:40px;
  background:#f7f7f7;
}

.hero-text{
  max-width:500px;
}

.hero-text h1{
  font-size:42px;
  margin-bottom:10px;
}

.hero-text p{
  color:#666;
}

/* BUTTONS */
.btn{
  padding:10px 18px;
  margin:5px;
  border:none;
  background:black;
  color:white;
  border-radius:6px;
  cursor:pointer;
}

/* IMAGE GRID */
.hero-images{
  display:grid;
  grid-template-columns:repeat(2,150px);
  gap:10px;
}

.hero-images img{
  width:150px;
  height:150px;
  object-fit:cover;
  border-radius:10px;
}

/* INFO */
.info-section{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:15px;
  padding:40px 20px;
}

.info-card{
  width:220px;
  padding:15px;
  border:1px solid #ddd;
  border-radius:10px;
  text-align:center;
  background:white;
}

</style>

</head>

<body>

<!-- HEADER -->
<header>
  <h2>🧣 AL-SHAHBAZ CHADAR HOUSE</h2>
</header>

<!-- HERO SECTION -->
<section class="hero">

  <div class="hero-text">
    <h1>Premium Chadar Collection</h1>
    <p>Wool • Pashmina • Cotton • Silk Handmade Collection</p>

    <button class="btn" onclick="location.href='shop.html'">Shop Now</button>
    <button class="btn" onclick="location.href='about.html'">About Us</button>
    <button class="btn" onclick="location.href='contact.html'">Contact</button>
  </div>

  <div class="hero-images">
    <img src="https://images.unsplash.com/photo-1602810318383-1a7d2b2f8c0c">
    <img src="https://images.unsplash.com/photo-1521334884684-d80222895322">
    <img src="https://images.unsplash.com/photo-1541099649105-f69ad21f3246">
    <img src="https://images.unsplash.com/photo-1512436991641-6745cdb1723f">
  </div>

</section>

<!-- INFO SECTION -->
<section class="info-section">

  <div class="info-card">
    <h3>📍 Address</h3>
    <p>Sarai Sidhu, Kabirwala, Khanewal</p>
  </div>

  <div class="info-card">
    <h3>📞 Contact</h3>
    <p>0316-6479910</p>
  </div>

  <div class="info-card">
    <h3>🧣 Quality</h3>
    <p>Premium Handmade Chadar Collection</p>
  </div>

  <div class="info-card">
    <h3>🚚 Delivery</h3>
    <p>All over Pakistan Available</p>
  </div>

</section>

</body>
</html>
