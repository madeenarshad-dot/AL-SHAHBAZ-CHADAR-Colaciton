<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Al-Shahbaz Collection | 50 PNG Designs</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f4f4; margin: 0; padding: 0; }
        h1 { text-align: center; padding: 40px 0; color: #333; }
        
        .gallery-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); 
            gap: 25px; 
            padding: 20px; 
            max-width: 1200px; 
            margin: auto; 
        }
        
        .card { 
            background: white; 
            border-radius: 12px; 
            overflow: hidden; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            transition: transform 0.3s ease; 
        }
        .card:hover { transform: scale(1.03); }
        
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .info { padding: 15px; text-align: center; }
        
        .btn-order { 
            display: block; 
            margin-top: 10px; 
            padding: 12px; 
            background: #000; 
            color: #fff; 
            text-decoration: none; 
            border-radius: 6px; 
            font-weight: bold;
        }
        .btn-order:hover { background: #333; }
    </style>
</head>
<body>

    <h1>Premium Chadar Collection</h1>

    <div class="gallery-container">
        <!-- یہ جاوا اسکرپٹ اب .png فارمیٹ کے مطابق اپڈیٹ کر دی گئی ہے -->
        <script>
            for (let i = 1; i <= 50; i++) {
                document.write(`
                    <div class="card">
                        <img src="assets/images/img${i}.png" alt="Design ${i}">
                        <div class="info">
                            <h3>Design ${i}</h3>
                            <a href="https://wa.me/923166479910" class="btn-order">Order Now</a>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>

</body>
</html>
