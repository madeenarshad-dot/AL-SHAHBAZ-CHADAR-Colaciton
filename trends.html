<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Seasonal Trends 2026 | Al-Shahbaz Chadar House</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: #f4f4f4; margin: 0; padding-bottom: 80px; }
        .search-container { text-align: center; padding: 20px; background: #eee; }
        #searchInput { padding: 10px; width: 300px; border: 1px solid #ccc; border-radius: 5px; }
        h1 { text-align: center; padding: 40px 0; color: #bdad78; background: #000; margin: 0; }
        .gallery-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 25px; padding: 20px; max-width: 1200px; margin: auto; }
        .card { background: rgb(214, 207, 207); border-radius: 15px; overflow: hidden; box-shadow: 0 8px 20px rgba(0,0,0,0.1); text-align: center; padding-bottom: 15px; }
        .card img { width: 100%; height: 300px; object-fit: cover; }
        .info { padding: 15px; }
        .price { font-weight: bold; color: #333; font-size: 1.1rem; display: block; margin-top: 5px; }
        .btn-order { display: block; margin: 10px 15px 0 15px; padding: 12px; background: #000; color: #fff; text-decoration: none; border-radius: 8px; font-weight: bold; }
        .lang-footer { position: fixed; bottom: 0; width: 100%; background: #000; padding: 10px 0; text-align: center; z-index: 9999; }
        .btn-lang { padding: 6px 12px; margin: 0 5px; cursor: pointer; border: 1px solid #d4af37; background: #000; color: #ddd5b9; font-weight: bold; border-radius: 4px; font-size: 12px; }
        .btn-lang:hover { background: #d4af37; color: #000; }
    </style>
</head>
<body>

    <h1 id="main-title">Seasonal Trends 2026</h1>
    <div class="search-container">
        <input type="text" id="searchInput" onkeyup="searchFunction()" placeholder="ڈیزائن سرچ کریں...">
    </div>

    <div class="gallery-container" id="gallery">
        <script>
            // قیمتوں کی ترتیب (ہر ڈیزائن کو الگ ریٹ)
            const prices = ["6,999", "5,499", "4,999", "6,999", "5,499", "4,999", "6,999", "5,499", "4,999", "6,999", "5,499", "4,999", "6,999", "5,499", "4,999", "6,999", "5,499", "4,999", "6,999", "5,499"];

            const langData = {
                'ur': { title: 'موسمی ٹرینڈز 2026', btn: 'واٹس ایپ پر آرڈر کریں', qual: 'کوالٹی: پریمیم 2026 فیبرک', pricePrefix: 'قیمت: ', search: 'ڈیزائن سرچ کریں...' },
                'en': { title: 'Seasonal Trends 2026', btn: 'Order on WhatsApp', qual: 'Quality: Premium 2026 Fabric', pricePrefix: 'Price: ', search: 'Search designs...' },
                'fa': { title: 'روندهای فصلی 2026', btn: 'سفارش در واتس‌اپ', qual: 'کیفیت: پارچه درجه یک', pricePrefix: 'قیمت: ', search: 'جستجوی طرح‌ها...' },
                'ar': { title: 'اتجاهات موسمية 2026', btn: 'اطلب عبر واتساب', qual: 'الجودة: قماش مميز', pricePrefix: 'السعر: ', search: 'ابحث عن التصاميم...' },
                'zh': { title: '2026年季节性趋势', btn: '在WhatsApp上订购', qual: '质量: 2026优质面料', pricePrefix: '价格: ', search: '搜索设计...' }
            };

            function changeLang(lang) {
                document.getElementById('main-title').innerText = langData[lang].title;
                document.getElementById('searchInput').placeholder = langData[lang].search;
                document.body.dir = (lang === 'ur' || lang === 'fa' || lang === 'ar') ? 'rtl' : 'ltr';
                document.querySelectorAll('.btn-order').forEach(b => b.innerText = langData[lang].btn);
                document.querySelectorAll('.q-text').forEach(q => q.innerText = langData[lang].qual);
                // قیمتوں کو اپ ڈیٹ کرنا
                document.querySelectorAll('.p-text').forEach((p, index) => {
                    p.innerText = langData[lang].pricePrefix + prices[index] + " روپے";
                });
            }

            function searchFunction() {
                let input = document.getElementById("searchInput").value.toUpperCase();
                let cards = document.getElementsByClassName("card");
                for (let i = 0; i < cards.length; i++) {
                    let title = cards[i].getElementsByTagName("h3")[0];
                    if (title.innerHTML.toUpperCase().indexOf(input) > -1) cards[i].style.display = "";
                    else cards[i].style.display = "none";
                }
            }

            for (let i = 1; i <= 20; i++) {
                document.write(`
                    <div class="card">
                        <img src="assets/images/img${i}.png" alt="Trend ${i}">
                        <div class="info">
                            <h3>Design ${i}</h3>
                            <p class="q-text">کوالٹی: پریمیم 2026 فیبرک</p>
                            <p class="p-text">قیمت: ${prices[i-1]} روپے</p>
                            <a href="https://wa.me/923166479910" class="btn-order">واٹس ایپ پر آرڈر کریں</a>
                        </div>
                    </div>
                `);
            }
        </script>
    </div>

    <div class="lang-footer">
        <button class="btn-lang" onclick="changeLang('ur')">اردو</button>
        <button class="btn-lang" onclick="changeLang('en')">English</button>
        <button class="btn-lang" onclick="changeLang('fa')">فارسی</button>
        <button class="btn-lang" onclick="changeLang('ar')">العربية</button>
        <button class="btn-lang" onclick="changeLang('zh')">中文</button>
    </div>

</body>
</html>
