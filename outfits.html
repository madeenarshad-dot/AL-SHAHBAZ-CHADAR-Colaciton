<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>AL-SHAHBAZ COLLECTION</title>
    <style>
        body { font-family: sans-serif; background-color: #f4f4f4; margin: 0; }
        .lang-switcher { text-align: center; padding: 20px; background: #000; }
        .btn-lang { padding: 8px 15px; margin: 2px; cursor: pointer; border: none; background: #d4af37; color: #000; font-weight: bold; border-radius: 4px; }
        .gallery-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; padding: 20px; max-width: 1200px; margin: auto; }
        .card { background: white; padding: 15px; border-radius: 10px; text-align: center; }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; }
        .btn-order { display: block; padding: 10px; background: #000; color: #d4af37; text-decoration: none; margin-top: 10px; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="lang-switcher">
        <button class="btn-lang" onclick="changeLang('ur')">اردو</button>
        <button class="btn-lang" onclick="changeLang('en')">English</button>
        <button class="btn-lang" onclick="changeLang('fa')">فارسی</button>
        <button class="btn-lang" onclick="changeLang('ar')">العربية</button>
        <button class="btn-lang" onclick="changeLang('zh')">中文</button>
    </div>

    <h1 id="title" style="text-align:center;">ہماری کلیکشن</h1>

    <div class="gallery-container" id="gallery">
        <script>
            const content = {
                'ur': { title: 'ہماری کلیکشن', btn: 'واٹس ایپ پر آرڈر کریں', quality: 'کوالٹی: سوپر فائن', price: 'قیمت: 6,999 روپے' },
                'en': { title: 'Our Collection', btn: 'Order on WhatsApp', quality: 'Quality: Super Fine', price: 'Price: 6,999 PKR' },
                'fa': { title: 'کلکسیون ما', btn: 'سفارش در واتس‌اپ', quality: 'کیفیت: عالی', price: 'قیمت: ۶,۹۹۹ روپیه' },
                'ar': { title: 'مجموعتنا', btn: 'اطلب عبر واتساب', quality: 'الجودة: ممتازة', price: 'السعر: 6,999 روبية' },
                'zh': { title: '我们的系列', btn: '在WhatsApp上订购', quality: '质量: 超级精细', price: '价格: 6,999 卢比' }
            };

            function changeLang(lang) {
                document.getElementById('title').innerText = content[lang].title;
                document.body.dir = (lang === 'ur' || lang === 'fa' || lang === 'ar') ? 'rtl' : 'ltr';
                
                document.querySelectorAll('.btn-order').forEach(btn => btn.innerText = content[lang].btn);
                document.querySelectorAll('.q-text').forEach(el => el.innerText = content[lang].quality);
                document.querySelectorAll('.p-text').forEach(el => el.innerText = content[lang].price);
            }

            for (let i = 1; i <= 20; i++) {
                document.write(`
                    <div class="card">
                        <img src="assets/images/outfit${i}.png" alt="Outfit">
                        <h3>Design ${i}</h3>
                        <p class="q-text">کوالٹی: سوپر فائن</p>
                        <p class="p-text">قیمت: 6,999 روپے</p>
                        <a href="https://wa.me/923166479910" class="btn-order">واٹس ایپ پر آرڈر کریں</a>
                    </div>
                `);
            }
        </script>
    </div>
    <!-- زبان تبدیل کرنے کا آپشن - ویب سائٹ کے نیچے -->
<div style="position: fixed; bottom: 0; width: 100%; background: #000; padding: 10px 0; text-align: center; z-index: 9999;">
    <button class="btn-lang" onclick="changeLang('ur')">اردو</button>
    <button class="btn-lang" onclick="changeLang('en')">English</button>
    <button class="btn-lang" onclick="changeLang('fa')">فارسی</button>
    <button class="btn-lang" onclick="changeLang('ar')">العربية</button>
    <button class="btn-lang" onclick="changeLang('zh')">中文</button>
</div>

<style>
    /* بٹنوں کا ڈیزائن */
    .btn-lang { 
        padding: 6px 12px; 
        margin: 0 5px; 
        cursor: pointer; 
        border: 1px solid #d4af37; 
        background: #000; 
        color: #d4af37; 
        font-weight: bold; 
        border-radius: 4px; 
        font-size: 12px;
    }
    .btn-lang:hover { background: #d4af37; color: #000; }
</style>
</body>
</html>
